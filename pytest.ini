[pytest]
# Only tests/ is collected (not the examples, the docs or the vendored code)
testpaths = tests
# The ClearMap of this checkout, not an installed one, whatever the terminal or IDE
pythonpath = .
addopts = -ra
# Registered so that pytest does not warn about the mark: select with -m slow, leave out with -m 'not slow'
markers =
    slow: takes minutes
# The event bus reports a failing subscriber instead of raising to the publisher: in the tests, it is an error
filterwarnings =
    error::ClearMap.Utils.exceptions.SubscriberFailedWarning

# ClearMap anaconda environment
#
# install: conda env create -f ClearMap.yml 
# update:  conda env update -f ClearMap.yml 
name: ClearMap3.2
channels:
  - conda-forge

dependencies:
  - python=3.11  # constraining seems to speed up resolution
  - cython>=3  # The Cython headers of NumPy 2 refuse an older Cython
  - ipython
  - jupyter
  - ipywidgets  # For pyvista
  - numpy  # Runs on 1.x and 2.x: not pinned, the compiled dependencies carry their NumPy bound
  - scipy
  - numexpr  # ClearMap.Analysis.vasculature.geometry_utils
  - pandas
  - pyarrow
  - scikit-image
  - scikit-learn
  - opencv
  - configobj  # config/config_handler.py and Settings.py import it (lazily in the installer and config/utils.py)
  - natsort
  - tqdm
  - matplotlib
  - seaborn  # Scripts/total_length_and_basic_stats.py and Scripts/vasculature_stats_scripts.py
  - tifffile
  - pyqt6  # PyQt5 also works: replace by pyqt=5 (and select it with QT_API=pyqt5 if both are installed)
  - qtpy  # ClearMap imports Qt through qtpy only (binding chosen by ClearMap.gui.qt_binding)
  - pyqtgraph>=0.13.5  # NumPy 2 fixes in 0.13.4 and 0.13.5; needs Qt >= 5.15
  - pygments
  - qdarkstyle
  - vispy
  - pyvista  # Not imported yet: replaces vispy gradually. Here so that the environment stays solvable with it
  - vtk
  - pyopengl
  - napari  # Not imported by ClearMap: users want it in the same environment, so it must stay solvable with
  #           our pins (Qt, NumPy, ...). Do not remove it to simplify a solve
  - graph-tool  # Graph.remove_self_loops finds the function in generation (recent) or stats (<= 2.45)
  - python-igraph
#  - pytorch<=2.2
#  - pytorch-cuda
  - cudatoolkit=11.8  # Placeholder: the installer (install_utils.patch_env) replaces or removes it for the machine
  - xmltodict  # to compensate for old tifffile
  - psutil
  - pytest
  - jsonschema
  - lxml  # gui/gui_logging.py (lxml.html); no longer < 5.2, napari >= 0.5 depends on lxml_html_clean
  - pip
  - pip:
    - itk~=5.4.5  # Not 5.4.4: it used np.bool, absent from NumPy 1.24 to 1.26 (fixed in ITK a637501, 5.4.5)
    - itk-elastix
#    - --extra-index-url https://download.pytorch.org/whl/{cuda_suffix}')
#    - torch
#    - torchvision
variables:
  PYTHONNOUSERSITE: 1
#  TMPDIR: /data/tmp

clearmap_schema: 3
clearmap_version: "3.1.0"

verbose: true
atlas:
  id: "ABA 2017 - adult mouse - 25µm"
  structure_tree_id: "ABA json 2022"
  align_files_folder: "Alignment"
templates:
  # The channel to be aligned to the atlas, typically the one holding autofluorescence data
  aligned_with_atlas:
    resample: true
    resampled_resolution: [25, 25, 25]
    align_with: "${reference}"   # atlas (constant)
    moving_channel: "other"   # The atlas moves onto the channel (self: the channel, intrinsically_aligned: neither)
    params_files: ["align_affine.txt", "align_bspline.txt"]
    landmarks_weights: [0, 0]   # Per params file, in percent: 0 (no landmarks) to 100 (see elastix_landmarks_weight)
  regular:
    resample: true
    resampled_resolution: [25, 25, 25]
    align_with: "${reference}"
    moving_channel: "other"   # The reference channel moves onto the channel
    params_files: ["align_affine.txt"]
    landmarks_weights: [0]

performance:
  resampling:
    n_processes: -1    # -1: all but one; None: all